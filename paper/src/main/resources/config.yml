# Use a fresh world after changing geometry, weights, palette order or materials.
# Classic world base. Height is the absolute Y of the top liquid block.
# Depth counts liquid layers only; one bedrock layer is placed at height - depth.
# Changing these settings requires a fresh world.
base:
  mode: nothing # nothing, water or lava
  height: -60
  depth: 3
# Reserved starter planets, challenge outposts and an Eye-locatable End portal.
progression:
  enabled: true
  # Attach vault islands only to this End dimension; other custom worlds are untouched.
  end-world-key: minecraft:the_end
cell-size: 64
min-radius: 12
max-radius: 26
gap: 6
crust-thickness: 3
# Weighted resource destinations, inspired by Seibai's offline Planetoids generator.
# Rare ore cores are rich rewards; weights describe planets, not individual blocks.
planets:
